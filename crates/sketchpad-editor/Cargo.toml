[package]
name = "sketchpad-editor"
version.workspace = true
edition.workspace = true

[dependencies]
sketchpad-engine = { path = "../sketchpad-engine" }
bytemuck = { version = "1.25", features = ["derive"] }
egui.workspace = true
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
image.workspace = true
log = "0.4"
pollster = "0.4"
rfd = "0.17.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
wgpu = "30.0.1"
winit = "0.30.13"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
directories = "6"
tempfile = "3"
