[workspace]
members = [".", "crates/sketchpad-format", "crates/sketchpad-ir", "crates/sketchpad-engine", "crates/sketchpad-editor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[package]
name = "sketchpad_rs"
version.workspace = true
edition.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:sketchpad-editor", "dep:egui"]

[dependencies]
egui = { workspace = true, optional = true }
sketchpad-engine = { path = "crates/sketchpad-engine" }
sketchpad-editor = { path = "crates/sketchpad-editor", optional = true }

[[bin]]
name = "sketchpad_rs"
path = "src/main.rs"
required-features = ["desktop"]

[dev-dependencies]
egui.workspace = true
